name: ABE CI

on:
  push:
    branches: [main, "abe/**", "build/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abe-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate ABE repository
        shell: bash
        run: bash scripts/abe/validate.sh
