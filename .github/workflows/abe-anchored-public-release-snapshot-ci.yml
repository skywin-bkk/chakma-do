name: ABE Anchored Public Release Snapshot CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build validated prerequisite evidence chain
        run: |
          set -euo pipefail
          python3 scripts/abe/build-public-manifest.py
          python3 scripts/abe/validate-public-provenance.py
          python3 scripts/abe/build-public-release-bundle.py
          python3 scripts/abe/validate-public-release-bundle.py
          python3 scripts/abe/build-public-release-readiness.py
          python3 scripts/abe/validate-public-release-readiness.py
          python3 scripts/abe/build-public-release-gate.py
          python3 scripts/abe/validate-public-release-gate.py
          python3 scripts/abe/build-public-release-custody.py
          python3 scripts/abe/validate-public-release-custody.py
          python3 scripts/abe/build-public-release-custody-history.py
          python3 scripts/abe/validate-public-release-custody-history.py
          python3 scripts/abe/build-public-release-custody-checkpoint.py
          python3 scripts/abe/validate-public-release-custody-checkpoint.py
          python3 scripts/abe/build-public-release-custody-checkpoint-continuity.py
          python3 scripts/abe/validate-public-release-custody-checkpoint-continuity.py
          python3 scripts/abe/build-public-release-custody-checkpoint-continuity-history.py
          python3 scripts/abe/validate-public-release-custody-checkpoint-continuity-history.py
          python3 scripts/abe/build-public-release-checkpoint-history-anchor.py
          python3 scripts/abe/validate-public-release-checkpoint-history-anchor.py
      - name: Build and independently validate ABE-027 snapshot
        run: |
          set -euo pipefail
          python3 scripts/abe/build-anchored-public-release-snapshot.py
          python3 scripts/abe/validate-anchored-public-release-snapshot.py
          cp build/abe/anchored-public-release-snapshot.json /tmp/snapshot.json
          python3 scripts/abe/build-anchored-public-release-snapshot.py
          cmp -s /tmp/snapshot.json build/abe/anchored-public-release-snapshot.json
      - name: Reject snapshot mutation and consequential authority
        run: |
          set -euo pipefail
          cp build/abe/anchored-public-release-snapshot.json /tmp/snapshot-good.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('build/abe/anchored-public-release-snapshot.json')
          s=json.loads(p.read_text())
          s['classification_boundary']='INTERNAL'
          p.write_text(json.dumps(s,indent=2,sort_keys=True)+'\n')
          PY
          if python3 scripts/abe/validate-anchored-public-release-snapshot.py; then
            echo 'validator accepted non-PUBLIC snapshot mutation' >&2; exit 1
          fi
          cp /tmp/snapshot-good.json build/abe/anchored-public-release-snapshot.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('build/abe/anchored-public-release-snapshot.json')
          s=json.loads(p.read_text())
          s['authorizes_deployment']=True
          p.write_text(json.dumps(s,indent=2,sort_keys=True)+'\n')
          PY
          if python3 scripts/abe/validate-anchored-public-release-snapshot.py; then
            echo 'validator accepted deployment authority mutation' >&2; exit 1
          fi
          cp /tmp/snapshot-good.json build/abe/anchored-public-release-snapshot.json
      - name: Reject anchor identity mutation
        run: |
          set -euo pipefail
          cp build/abe/public-release-checkpoint-history-anchor.json /tmp/anchor-good.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('build/abe/public-release-checkpoint-history-anchor.json')
          a=json.loads(p.read_text())
          a['anchor_digest']['digest']='0'*64
          p.write_text(json.dumps(a,indent=2,sort_keys=True)+'\n')
          PY
          if python3 scripts/abe/validate-anchored-public-release-snapshot.py; then
            echo 'validator accepted mutated ABE-026 anchor identity' >&2; exit 1
          fi
          cp /tmp/anchor-good.json build/abe/public-release-checkpoint-history-anchor.json
          python3 scripts/abe/validate-anchored-public-release-snapshot.py
      - name: Assert authoritative fail-closed invariants
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('config/abe/task-queue.json').read_text())
          assert q['authoritative_department_scope']==['DO-DEP-01','DO-DEP-14']
          assert q['verified_baseline']=='DO-DEP-04'
          assert q['rules']=={'public_exposure':'explicit-public-only','external_writes':False,'production_deploy':False,'destructive_actions':False}
          s=json.loads(Path('build/abe/anchored-public-release-snapshot.json').read_text())
          assert s['stage']=='ABE-027'
          assert s['classification_boundary']=='PUBLIC_ONLY'
          assert s['authorizes_deployment'] is False
          assert s['external_write_performed'] is False
          assert s['production_deploy_performed'] is False
          assert s['publication_performed'] is False
          assert s['destructive_action_performed'] is False
          assert s['secret_access_performed'] is False
          PY
