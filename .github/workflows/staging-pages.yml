name: D.O. Website Staging

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/staging-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-staging
  cancel-in-progress: true

environment:
  name: github-pages
  url: ${{ steps.deployment.outputs.page_url }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate ABE safety gates
        shell: bash
        run: bash scripts/abe/validate.sh
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - name: Deploy staging site
        id: deployment
        uses: actions/deploy-pages@v4
